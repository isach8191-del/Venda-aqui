name: APK para Android

on:
  push:
    branches: [main, master, principal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Compilar aplicação Web (Vite)
        run: npx vite build --base=./

      - name: Sincronizar projeto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Usar chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      - name: Gerar APK Android (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: hic-venditur-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
