name: APK para Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Compilar aplicação Web (Vite)
        run: npm run build

      - name: Adicionar ou sincronizar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permissão de execução ao Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Gerar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Hic-Venditur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
